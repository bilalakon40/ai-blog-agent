name: كتابة ونشر مقال يومي

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: node src/generate.js
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - run: node src/build.js

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          keep_files: true
          user_name: "AI Blogger"
          user_email: "bot@blogger.ai"
